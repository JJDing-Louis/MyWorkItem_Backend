services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?請在 .env 設定 MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?請在 .env 設定符合 SQL Server 原則的 MSSQL_SA_PASSWORD}
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD:?請在 .env 設定 MSSQL_APP_PASSWORD}
    volumes:
      - ./database/scripts/EnsureLocalLogin.sql:/scripts/EnsureLocalLogin.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v AppPassword="$$MSSQL_APP_PASSWORD"
        -i /scripts/EnsureLocalLogin.sql
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["dotnet", "/app/migrator/MyWorkItem.DatabaseMigrator.dll"]
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=MyWorkItem;User Id=myworkitem;Password=${MSSQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-manager}
      SEED_WORKER_PASSWORD: ${SEED_WORKER_PASSWORD:-Worker}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=MyWorkItem;User Id=myworkitem;Password=${MSSQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?請在 .env 設定 JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sqlserver-data:
